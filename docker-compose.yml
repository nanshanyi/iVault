services:
  ivault:
    # 默认使用 CI 预构建镜像：NAS 只需 pull，几十秒完成，不依赖 GitHub 源码可达。
    # 想本地编译（改代码 / 完全离线）：IVAULT_BUILD=1 docker compose up -d --build
    image: ghcr.io/nanshanyi/ivault:${IVAULT_TAG:-latest}
    build:
      context: .
      args:
        APT_MIRROR: ${APT_MIRROR:-}
    container_name: ivault
    # 访问 USB 总线是 iPhone 配对与整机备份的硬性前提
    privileged: true
    devices:
      - /dev/bus/usb:/dev/bus/usb
    ports:
      - "${IVAULT_PORT:-8666}:8666"
    environment:
      - TZ=Asia/Shanghai
      - IVAULT_LOG=INFO
    volumes:
      # 备份库：Apple MobileSync 格式，含每台 UDID 的完整数据目录
      - ${BACKUP_LOCATION:?请在 .env 中设置 BACKUP_LOCATION（NAS 上的备份目录绝对路径）}:/data/backups
      # 元数据：SQLite 数据库
      - ${META_LOCATION:-/volume1/ivault/data}:/data/meta
      # 配对证书：libimobiledevice 由 usbmuxd 把记录固定写到 /var/lib/lockdown，
      # 必须挂到持久卷，否则容器重建后需要重新插线配对
      - ${META_LOCATION:-/volume1/ivault/data}/lockdown:/var/lib/lockdown
      # 只读挂入宿主机的系统标识，用于在界面上显示真实的 NAS 系统版本（UGOS x.y）。
      # 容器内的 /etc/os-release 是 Debian 的，不能用；读不到时界面会自动隐藏这段。
      - /etc/os-release:/host-os-release:ro
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
