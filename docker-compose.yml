services:
  ivault:
    # 默认使用 CI 预构建镜像：NAS 只需 pull，几十秒完成，不依赖 GitHub 源码可达。
    # 想本地编译（改代码 / 完全离线）：IVAULT_BUILD=1 docker compose up -d --build
    image: ghcr.io/nanshanyi/ivault:${IVAULT_TAG:-latest}
    build:
      context: .
      args:
        APT_MIRROR: ${APT_MIRROR:-}
    container_name: ivault
    # 访问 USB 总线是 iPhone 配对与整机备份的硬性前提
    privileged: true
    # 注意：这里必须走 volumes 的 bind mount，不能写 devices:
    # devices: 只在容器创建时快照一份 /dev 节点，运行中插拔产生的新节点
    # （如 /dev/bus/usb/003/008）在容器内不存在，usbmuxd 重扫只会报
    # ENOENT(errno=2) → LIBUSB_ERROR_NO_DEVICE，热插拔永远失效。
    ports:
      - "${IVAULT_PORT:-8666}:8666"
    environment:
      - TZ=Asia/Shanghai
      - IVAULT_LOG=${IVAULT_LOG:-INFO}
      # 排查用：1=usbmuxd 输出详细日志；[netmuxd] 的级别由 IVAULT_WIFI_LOG 控制
      - IVAULT_USBMUXD_VERBOSE=${IVAULT_USBMUXD_VERBOSE:-0}
      - IVAULT_WIFI_LOG=${IVAULT_WIFI_LOG:-warn}
      # 可选：想让界面左下角显示系统版本时填（例如 "DSM 7.2"、"UGOS 1.21"、
      # "QTS 5.1"）。不填则尝试读取下面的 /host-os-release，都取不到就隐藏这段。
      - IVAULT_OS_NAME=${IVAULT_OS_NAME:-}
      # 1=启动无线通道（netmuxd）；0=只用 USB。无线还需要 host 网络，
      # 见 docker-compose.wifi.yml，否则 mDNS 收不到局域网设备。
      - IVAULT_WIFI=${IVAULT_WIFI:-1}
    volumes:
      # USB 总线：用 bind mount 才能实时看到插拔产生的设备节点（见上方说明）
      - /dev/bus/usb:/dev/bus/usb
      # 备份库：Apple MobileSync 格式，含每台 UDID 的完整数据目录
      - ${BACKUP_LOCATION:?请在 .env 中设置 BACKUP_LOCATION（宿主机上的备份目录绝对路径）}:/data/backups
      # 元数据：SQLite 数据库
      - ${META_LOCATION:-./data}:/data/meta
      # 配对证书：libimobiledevice 由 usbmuxd 把记录固定写到 /var/lib/lockdown，
      # 必须挂到持久卷，否则容器重建后需要重新插线配对
      - ${META_LOCATION:-./data}/lockdown:/var/lib/lockdown
      # 可选：显示宿主机系统版本。各发行版都有 /etc/os-release，取消注释即可。
      # 若你的系统没有该文件，Docker 会在宿主机上创建一个同名空目录，所以默认不挂。
      # - /etc/os-release:/host-os-release:ro
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
