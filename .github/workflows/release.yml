name: Release image

# 推 tag（v0.2.0 之类）时构建镜像并推送到 GHCR，
# 用户在 NAS 上只需 docker compose pull，不必自己编译工具链。
#
# 默认只构建 linux/amd64：绝大多数 NAS 是 x86（群晖 / 威联通 / 绿联 / 飞牛的主流机型），
# arm64 在 GitHub 的 runner 上要走 QEMU 模拟，耗时多一倍以上。
# 需要 ARM（树莓派、部分群晖、Apple Silicon 上的 Docker）时，在 Actions 页面手动触发，
# platforms 填 "linux/amd64,linux/arm64"。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "目标架构（逗号分隔）"
        required: false
        default: "linux/amd64"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/nanshanyi/ivault

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and platforms
        id: v
        env:
          INPUT_PLATFORMS: ${{ inputs.platforms }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="sha-$(git rev-parse --short "${GITHUB_SHA}")"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "platforms=${INPUT_PLATFORMS:-linux/amd64}" >> "$GITHUB_OUTPUT"
          echo "building ${version} for ${INPUT_PLATFORMS:-linux/amd64}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.v.outputs.platforms }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            IVAULT_VERSION=${{ steps.v.outputs.version }}
            IVAULT_COMMIT=${{ github.sha }}

      - name: Summary
        run: |
          {
            echo "### iVault 镜像已发布"
            echo ""
            echo "- 版本：\`${{ steps.v.outputs.version }}\`"
            echo "- 架构：\`${{ steps.v.outputs.platforms }}\`"
            echo "- 镜像：\`${{ env.IMAGE }}:${{ steps.v.outputs.version }}\`"
            echo ""
            echo "首次发布后请到 Settings → Packages 把该包可见性改为 Public，"
            echo "否则 NAS 上 pull 需要先 \`docker login ghcr.io\`。"
          } >> "$GITHUB_STEP_SUMMARY"
